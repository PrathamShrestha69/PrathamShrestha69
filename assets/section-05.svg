<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="CONTRIBUTIONS">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#05010f"/><stop offset=".5" stop-color="#14063d"/><stop offset="1" stop-color="#05010f"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect width="1200" height="110" rx="18"/></clipPath>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="110" fill="url(#bg)"/>
<text x="604.0" y="64" fill="#ff2bd6" opacity=".85" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="4">CONTRIBUTIONS<animate attributeName="x" dur="4.5s" repeatCount="indefinite" calcMode="discrete" values="604.0;604.0;614.0;590.0;609.0;596.0;604.0;604.0" keyTimes="0;.62;.64;.66;.68;.70;.72;1"/></text>
<text x="596.0" y="60" fill="#00f0ff" opacity=".85" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="4">CONTRIBUTIONS<animate attributeName="x" dur="4.5s" repeatCount="indefinite" calcMode="discrete" values="596.0;596.0;586.0;610.0;591.0;604.0;596.0;596.0" keyTimes="0;.62;.64;.66;.68;.70;.72;1"/></text>
<text x="600.0" y="62" fill="url(#g)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="4" filter="url(#glow)">CONTRIBUTIONS</text>
<text x="600.0" y="92" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" letter-spacing="5" fill="#9d8cd8">05 &#47;&#47; IN THREE DIMENSIONS</text>
<rect x="0" y="106" width="1200" height="2" fill="url(#beam)" opacity=".8"/>
<rect y="105" width="160" height="4" rx="2" fill="#fff" filter="url(#glow)"><animate attributeName="x" values="-160;1200" dur="3.2s" repeatCount="indefinite"/></rect>
</g>
</svg>