<text xml:space="preserve" x="44" y="112" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" opacity="0"><tspan fill="#b6ff3b">pratham@nepal</tspan><tspan fill="#fff">:~$ </tspan><tspan fill="#00f0ff">whoami</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.040;0.055;1"/></text><text xml:space="preserve" x="44" y="145" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" opacity="0"><tspan fill="#fff">  Pratham Shrestha  </tspan><tspan fill="#9d8cd8">// frontend developer</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.100;0.115;1"/></text><text xml:space="preserve" x="44" y="178" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" opacity="0"><tspan fill="#b6ff3b">pratham@nepal</tspan><tspan fill="#fff">:~$ </tspan><tspan fill="#00f0ff">cat stack.txt</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.180;0.195;1"/></text><text xml:space="preserve" x="44" y="211" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" opacity="0"><tspan fill="#ffd0f6">  React · Next.js · TypeScript · Node · MongoDB · Figma</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.240;0.255;1"/></text><text xml:space="preserve" x="44" y="244" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" opacity="0"><tspan fill="#b6ff3b">pratham@nepal</tspan><tspan fill="#fff">:~$ </tspan><tspan fill="#00f0ff">./status --now</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.330;0.345;1"/></text><text xml:space="preserve" x="44" y="277" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" opacity="0"><tspan fill="#ffb020">  ▸ exploring </tspan><tspan fill="#fff">Next.js, motion design &amp; creative UI</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.390;0.405;1"/></text><text xml:space="preserve" x="44" y="310" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" opacity="0"><tspan fill="#ffb020">  ▸ obsessed with </tspan><tspan fill="#fff">smooth animation, clean code, 3D on the web</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.450;0.465;1"/></text><text xml:space="preserve" x="44" y="343" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="21" opacity="0"><tspan fill="#b6ff3b">pratham@nepal</tspan><tspan fill="#fff">:~$ </tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.530;0.545;1"/></text><g opacity="0"><animate attributeName="opacity" dur="22s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.53;0.545;1"/><rect x="258" y="324" width="12" height="25" fill="#b6ff3b"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></rect></g>
