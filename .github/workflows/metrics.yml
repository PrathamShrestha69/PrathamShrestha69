# Builds the stats images in metrics/ (used by README.md) from the GitHub API.
# Uses the built-in GITHUB_TOKEN, so there is no secret to set up.
name: Metrics

on:
  push:
    branches: [main, profile-terminal, profile-metrics]
    paths:
      - ".github/scripts/metrics.py"
      - ".github/workflows/metrics.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/metrics.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet || (git commit -m "chore: update metrics" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")
