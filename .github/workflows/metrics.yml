# Generates the GitHub metrics SVGs shown in README.md using lowlighter/metrics.
# Setup: create a classic personal access token (scopes: read:org, read:user, repo)
# and save it as the repository secret METRICS_TOKEN, then run this workflow once.
name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Isometric 3D contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrathamShrestha69
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Asia/Kathmandu
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrathamShrestha69
          filename: metrics/overview.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Kathmandu

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrathamShrestha69
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Kathmandu
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 6
          plugin_languages_details: bytes-size, percentage

      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrathamShrestha69
          filename: metrics/habits.svg
          base: ""
          config_timezone: Asia/Kathmandu
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrathamShrestha69
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Kathmandu
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 12
